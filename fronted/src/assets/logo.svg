<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <defs>
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Diamond mark -->
  <g transform="translate(0, 4)">
    <!-- Outer glow -->
    <rect x="2" y="2" width="28" height="28" rx="7"
      transform="rotate(45 16 16)"
      fill="url(#glow-grad)" opacity="0.6"/>
    <!-- Diamond border -->
    <rect x="4" y="4" width="24" height="24" rx="6"
      transform="rotate(45 16 16)"
      fill="url(#mark-grad)" opacity="0.15"
      stroke="url(#mark-grad)" stroke-width="1.2"/>
    <!-- Inner diamond fill -->
    <rect x="5.5" y="5.5" width="21" height="21" rx="5"
      transform="rotate(45 16 16)"
      fill="url(#mark-grad)"/>
    <!-- Inner square -->
    <rect x="10" y="10" width="12" height="12" rx="3"
      fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    <!-- Center dot -->
    <circle cx="16" cy="16" r="1.8" fill="white" opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text
    x="44"
    y="27"
    font-family="'Manrope', 'Inter', system-ui, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="-0.8"
    fill="white">nuvora</text>

  <!-- Dot accent -->
  <text
    x="131"
    y="27"
    font-family="'Manrope', 'Inter', system-ui, sans-serif"
    font-size="22"
    font-weight="800"
    fill="#7c3aed">.</text>
</svg>
