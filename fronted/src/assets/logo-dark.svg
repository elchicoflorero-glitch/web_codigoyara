<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <defs>
    <linearGradient id="br-gd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd21f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bg-gd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
  </defs>

  <!-- Icon box -->
  <rect x="0" y="4" width="32" height="32" rx="7" fill="url(#bg-gd)"/>
  <rect x="0.75" y="4.75" width="30.5" height="30.5" rx="6.5"
    fill="none" stroke="rgba(255,210,31,0.2)" stroke-width="1"/>

  <!-- < bracket -->
  <polyline points="11,13 7,20 11,27"
    stroke="url(#br-gd)" stroke-width="2.4"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Y -->
  <line x1="17" y1="13" x2="21.5" y2="19" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="26" y1="13" x2="21.5" y2="19" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="21.5" y1="19" x2="21.5" y2="27" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Wordmark dark -->
  <text
    x="42"
    y="28"
    font-family="'Manrope', 'Inter', system-ui, sans-serif"
    font-size="19"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#0f1f35">codigo</text>

  <text
    x="117"
    y="28"
    font-family="'Manrope', 'Inter', system-ui, sans-serif"
    font-size="19"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#d97706">yara</text>

  <text
    x="162"
    y="28"
    font-family="'Manrope', 'Inter', system-ui, sans-serif"
    font-size="19"
    font-weight="800"
    fill="#d97706">.</text>
