<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="bracket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd21f"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg-grad)"/>

  <!-- Outer glow ring -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.5"
    fill="none" stroke="rgba(255,210,31,0.18)" stroke-width="1"/>

  <!-- Left code bracket < (golden) -->
  <polyline
    points="11,9 7,16 11,23"
    stroke="url(#bracket-grad)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Y shape in white — stem + two arms -->
  <!-- Left arm -->
  <line x1="17" y1="9" x2="21.5" y2="15" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="26" y1="9" x2="21.5" y2="15" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Stem -->
  <line x1="21.5" y1="15" x2="21.5" y2="23" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
</svg>
